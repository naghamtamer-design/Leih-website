<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0e0d">
  <title>لَيْه؟ — الإصدار الأول: ما وراء السؤال</title>

  <!-- Google Fonts: Aref Ruqaa & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0f0e0d;
      --paper: #eee0ca;
      --burgundy: #451321;
      --olive: #3c4636;
      --navy: #1e293b;
      --text-dark: #382018;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--paper);
      font-family: 'Amiri', serif;
      padding: 35px 14px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* هيدر هادي وفاخر باللوجو الكبير */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .site-brand {
      font-family: 'Aref Ruqaa', serif;
      font-size: 64px;
      color: var(--paper);
      margin-bottom: 12px;
      line-height: 1;
    }

    .site-subtitle {
      font-size: 14px;
      letter-spacing: 1.8px;
      opacity: 0.7;
      margin-top: 8px;
    }

    .deck-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* حاوية الكارت مع تأثير القلب الثلاثي الأبعاد */
    .card-wrapper {
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      min-height: 200px;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-wrapper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front-face, .card-back-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ظهر الكارت (الظاهر أولاً) */
    .card-back-face {
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
    }

    .card-back-logo {
      font-family: 'Aref Ruqaa', serif;
      font-size: 54px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .card-back-divider {
      width: 42px;
      height: 1px;
      background: currentColor;
      opacity: 0.4;
      margin: 8px 0;
    }

    .card-back-tagline {
      font-size: 12px;
      letter-spacing: 1.5px;
      opacity: 0.85;
    }

    /* وجه الكارت (السؤال) */
    .card-front-face {
      transform: rotateY(180deg);
      position: relative;
    }

    /* ألوان المجموعات */
    .theme-burgundy {
      background-color: var(--burgundy);
      color: var(--paper);
      border: 1px solid rgba(238, 224, 202, 0.15);
    }
    .theme-paper {
      background-color: var(--paper);
      color: var(--text-dark);
      border: 1px solid rgba(69, 19, 33, 0.15);
    }
    .theme-olive {
      background-color: var(--olive);
      color: var(--paper);
      border: 1px solid rgba(238, 224, 202, 0.15);
    }
    .theme-navy {
      background-color: var(--navy);
      color: var(--paper);
      border: 1px solid rgba(238, 224, 202, 0.15);
    }

    .card-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 12px;
    }

    .card-subtitle-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 24px;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .card-main-question {
      font-size: 18px;
      line-height: 1.8;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .card-reflection-line {
      font-size: 13px;
      font-style: italic;
      opacity: 0.75;
      line-height: 1.6;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      font-size: 12px;
      opacity: 0.5;
    }

    @media (max-width: 480px) {
      .deck-container {
        width: 100%;
      }
      .card-main-question {
        font-size: 16px;
      }
      .card-inner {
        min-height: 220px;
      }
      .site-brand {
        font-size: 58px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="site-brand">لَيْه؟</h1>
    <p class="site-subtitle">الإصدار الأول: ما وراء السؤال</p>
  </header>

  <main class="deck-container" id="deckContainer">
    <!-- سينشئ الجافاسكريبت الكروت هنا -->
  </main>

  <footer>
    استوديو لَيْه؟ — جميع الحقوق محفوظة © 2026
  </footer>

  <script>
    const questionsData = [
      // الباب اللي جوانا
      { num: "01", group: "الباب اللي جوانا", title: "المرآة", icon: "🔑", q: "إيه الحقيقة اللي عارفها عن نفسك، بس بتتصرف كل يوم كأنك مش عارفها؟", hint: "«مش كل اللي مستخبي عن الناس، مستخبي عنك.»", theme: "theme-burgundy" },
      { num: "02", group: "الباب اللي جوانا", title: "من غير شهود", icon: "👁", q: "لو محدش هيحكم عليك، إيه أول حاجة هتعترف إنك نفسك تعملها؟", hint: "«تخيّل إن محدش هيرفع إجابك أَبَدًا.»", theme: "theme-paper" },
      { num: "03", group: "الباب اللي جوانا", title: "بعد نص الليل", icon: "🌙", q: "إيه أكتر شعور بتخاف تواجهه لما الدنيا تسكت وميفضلش حواليك غير نفسك؟", hint: "«اختار الشعور، مش الحكاية اللي وراه.»", theme: "theme-olive" },
      { num: "04", group: "الباب اللي جوانا", title: "النسخة القديمة", icon: "⏳", q: "لو قابلت نفسك من خمس سنين، إيه أكتر حاجة هتخاف إنها تلاحظها فيك؟", hint: "«مش كل تغيير معناه إننا اتقدمنا.»", theme: "theme-paper" },
      { num: "05", group: "الباب اللي جوانا", title: "ملف قديم", icon: "📁", q: "إيه الحاجة اللي بتقول إنك تخطيتها، لكن لسه بتتغير لما حد يجيب سيرتها؟", hint: "«اقرأ السؤال كأنك بتسأله لشخص تاني.»", theme: "theme-burgundy" },

      // أثر مش باين
      { num: "06", group: "أثر مش باين", title: "جملة فضلت", icon: "❞", q: "إيه الجملة اللي قالها لك شخص، وغيّرت نظرتك لنفسك من يومها؟", hint: "«أحيانًا بننسى الموقف، ونفضل فاكرين كلمة.»", theme: "theme-paper" },
      { num: "07", group: "أثر مش باين", title: "شخص مش موجود", icon: "🤍", q: "ليه ساعات بنشتاق لنسخة من شخص، رغم إنا عارفين إن النسخة دي م بقتش موجودة؟", hint: "«إنت مشتاق للشخص، ولا للي كنت بتحسه معاه؟»", theme: "theme-burgundy" },
      { num: "08", group: "أثر مش باين", title: "الباب المقفول", icon: "🚪", q: "لو شخص غاب من حياتك ورجع، إيه الحاجة اللي لازم تتغير عشان تسمحله يقرب تاني؟", hint: "«الرجوع مش دايماً معناه إن الباب لسه مفتوح.»", theme: "theme-paper" },
      { num: "09", group: "أثر مش باين", title: "رسالة مش هتتبعت", icon: "✉️", q: "مين الشخص اللي نفسك يعرف إنك اتغيرت بسببه، من غير ما تضطر تحكيله إزاي؟", hint: "«اكتب اسمه في سرك، وكمل.»", theme: "theme-olive" },
      { num: "10", group: "أثر مش باين", title: "الحساب القديم", icon: "⚖️", q: "لو كل شخص أذاك نسي اللي عمله، لكن إنت فضلت فاكره، هل ده هيغيّر قرارك تجاهه؟", hint: "«النسيان مش شرط يكون دليل إن الأذى انتهى.»", theme: "theme-paper" },

      // الوجه التاني
      { num: "11", group: "الوجه التاني", title: "عكس المظهر", icon: "🎭", q: "إيه الصفة اللي بتنتقدها في الناس، وممكن تكون موجودة فيك من غير ما تاخد بالك؟", hint: "«اللي بيضايقنا بره، ساعات بيبقى مراية لجوه.»", theme: "theme-navy" },
      { num: "12", group: "الوجه التاني", title: "شباك مَفْتوح", icon: "🪟", q: "لو كل الناس شافوا أفكارك لمدة دقيقة واحدة، إيه أكتر حاجة هتتمنى إنها م تظهرش؟", hint: "«الخوف من الشفافية.. ولا الخوف من الحكم؟»", theme: "theme-paper" },
      { num: "13", group: "الوجه التاني", title: "ثمن السكوت", icon: "🕯", q: "إيه القرار اللي بتأجله، مش لأنك مش عارف الصح، لكن لأنك عارف ثمنه؟", hint: "«التأجيل مش حل، هو مجرد تقسيط للوجع.»", theme: "theme-burgundy" },
      { num: "14", group: "الوجه التاني", title: "الجانب المظلم", icon: "🌘", q: "لو اكتشفت إنك الشخص المؤذي في حكاية حد تاني، هتحاول تبرر لنفسك ولا تفهم إنت أذيته إزاي؟", hint: "«الحقيقة الصعبة أفضل من وهم البراءة.»", theme: "theme-navy" },
      { num: "15", group: "الوجه التاني", title: "قوة مُرهِقة", icon: "⚓", q: "إيه الحاجة اللي بتتمسك بيها عشان تثبت إنك قوي، مع إنها ممكن تكون أكتر حاجة بتتعبك؟", hint: "«التخلي ساعات بيبقى أعلى درجات القوة.»", theme: "theme-paper" },

      // لو كان ممكن
      { num: "16", group: "لو كان ممكن", title: "رسالة من هناك", icon: "📜", q: "لو لقيت جواب مكتوب بخط إيدك، لكن من نسخة منك عاشت حياة مختلفة، تتمنى يكون مكتوب فيه إيه؟", hint: "«الخيال هو الباب اللي بنطل منه على اختياراتنا.»", theme: "theme-paper" },
      { num: "17", group: "لو كان ممكن", title: "ممحاة الذكريات", icon: "🧹", q: "لو تقدر تمسح ذكرى واحدة من غير ما تمسح الدرس اللي اتعلمته منها، هتختار أنهي ذكرى؟", hint: "«الألم بيسيب أثر، والدرس بيسيب حكمة.»", theme: "theme-olive" },
      { num: "18", group: "لو كان ممكن", title: "بداية جديدة", icon: "🌱", q: "لو صحيت بكرة ومحدش فاكر عنك أي حاجة، هتختار تعرّف نفسك إزاي من البداية؟", hint: "«مين إنت لما تجرّد نفسك من انطباعات الناس؟»", theme: "theme-paper" },
      { num: "19", group: "لو كان ممكن", title: "الساعة الحاسمة", icon: "⏱", q: "لو عرفت اليوم والساعة اللي هتتغير فيهم حياتك للأبد، هتستنى اللحظة ولا تحاول تمنعها؟", hint: "«التغيير بيخوّف حتى لو كان للأحسن.»", theme: "theme-navy" },
      { num: "20", group: "لو كان ممكن", title: "الباب البديل", icon: "🔑", q: "لو كان فيه باب هتشوف وراه حياة الشخص اللي كنت ممكن تبقى مكانه، هتفتحه حتى لو مش هتعرف ترجع؟", hint: "«الفضول أوقات بيفتح أبواب ملهاش رجوع.»", theme: "theme-burgundy" },

      // الطريق اللي ما اخترناهوش
      { num: "21", group: "الطريق اللي ما اخترناهوش", title: "حرية كاملة", icon: "🕊", q: "لو اختفت توقعات الناس منك تماماً، إيه أول قرار ممكن تاخده ومش هتحتاج تبرره لحد؟", hint: "«عش حياتك لنفسك، مش لجمهور.»", theme: "theme-paper" },
      { num: "22", group: "الطريق اللي ما اخترناهوش", title: "الحلم المؤجل", icon: "✨", q: "إيه الحلم اللي لسه جواك، لكن كل ما تقرب منه تفتكر أسباب تأجيله؟", hint: "«الخوف بيغلف أحلامنا بأعذار منطقية.»", theme: "theme-burgundy" },
      { num: "23", group: "الطريق اللي ما اخترناهوش", title: "المعادلة الصعبة", icon: "🧭", q: "لو لازم تختار بين حياة آمنة إنت مش بتحبها، وحياة بتحبها لكن نهايتها مش مضمونة، هتختار إيه؟", hint: "«الأمان الدائم ساعات بيبقى سجن هادي.»", theme: "theme-olive" },
      { num: "24", group: "الطريق اللي ما اخترناهوش", title: "نقطة التحول", icon: "🔄", q: "إيه اللحظة اللي كنت فاكر إنك خسرت فيها كل حاجة، وبعدين اكتشفت إنك كنت بتدأ من جديد؟", hint: "«النهايات أوقات بتبقى بدايات متخفية.»", theme: "theme-navy" },
      { num: "25", group: "الطريق اللي ما اخترناهوش", title: "لقاء المستقبل", icon: "🔮", q: "لو قابلت نفسك بعد عشر سنين، إيه السؤال اللي هتخاف تسألهولها؟", hint: "«إحنا بنخاف نعرف إنا وصلنا ولا لسه.»", theme: "theme-paper" },

      // قبل ما تقفل الكشكول
      { num: "26", group: "قبل ما تقفل الكشكول", title: "مصدر الخوف", icon: "🔒", q: "لو كل اختياراتك لحد النهارده كانت نتيجة خوف واحد، تتوقع يكون خوفك من إيه؟", hint: "«معرفة الخوف الأساسي هي أول خطوة للحرية.»", theme: "theme-burgundy" },
      { num: "27", group: "قبل ما تقفل الكشكول", title: "الفهم الضمني", icon: "🤝", q: "إيه الحاجة اللي نفسك حد يفهمها عنك من غير ما تضطر تشرحها أو تطلبها؟", hint: "«الشعور بالأمان هو إنك تتفهم من غير كلام.»", theme: "theme-paper" },
      { num: "28", group: "قبل ما تقفل الكشكول", title: "الرسالة الأخيرة", icon: "💌", q: "لو هتكتب رسالة لشخص مش هتقابله تاني أبَدًا، هتختار تعتذرله، تشكره، تعاتبه، ولا توّدعه؟", hint: "«الكلمات الأخيرة بتحدد مسار التعافي.»", theme: "theme-olive" },
      { num: "29", group: "قبل ما تقفل الكشكول", title: "دون ندم", icon: "🌅", q: "لو عرفت إنك مش هتندم على أي قرار هتاخده من النهارده، إيه أول حاجة هتعملها؟", hint: "«الندم هو الثقل الحقيقي، مش الاختيار.»", theme: "theme-paper" },
      { num: "30", group: "قبل ما تقفل الكشكول", title: "المواجهة الأخيرة", icon: "🏁", q: "إنت بتهرب من إيه النهارده، وإيه اللي ممكن يحصل لو بطلت تهرب؟", hint: "«الهروب بيتعب أكتر من المواجهة.»", theme: "theme-navy" }
    ];

    function renderInteractiveDeck() {
      const container = document.getElementById("deckContainer");
      container.innerHTML = "";

      questionsData.forEach(item => {
        const wrapper = document.createElement("div");
        wrapper.className = "card-wrapper";

        wrapper.innerHTML = `
          <div class="card-inner">
            <!-- ظهر الكارت (يظهر أولاً) -->
            <div class="card-back-face ${item.theme}">
              <div class="card-back-logo">ليه؟</div>
              <div class="card-back-divider"></div>
              <div class="card-back-tagline">لكل سؤال حكاية</div>
            </div>

            <!-- وجه الكارت (يظهر بعد القَلْب) -->
            <div class="card-front-face ${item.theme}">
              <div>
                <div class="card-header-meta">
                  <span class="card-icon">${item.icon}</span>
                  <span class="card-number-badge">${item.num} / 30</span>
                </div>
                <div class="card-subtitle-title">${item.num} — ${item.title}</div>
                <div class="card-main-question">${item.q}</div>
              </div>
              <div class="card-reflection-line">${item.hint}</div>
            </div>
          </div>
        `;

        wrapper.addEventListener("click", () => {
          wrapper.classList.toggle("flipped");
        });

        container.appendChild(wrapper);
      });
    }

    renderInteractiveDeck();
  </script>
</body>
</html>
